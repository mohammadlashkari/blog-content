verses:
  - text: |
      جمله بی‌قراریت از طلب قرار توست
      طالب بی‌قرار شو تا که قرار آیدت
    author: مولانا
    language: fa

  - text: Inspiration is perishable act on it immediately
    author: Naval Ravikant
    language: en

  - text: |
      خبر به دورترین نقطه‌ی جهان برسد
      نخواست او به من خسته بی‌گمان برسد

      شکنجه بیشتر از این‌؟ که پیش چشم خودت‌
      کسی که سهم تو باشد، به دیگران برسد

      چه می‌کنی‌؟ اگر او را که خواستی یک عمر
      به راحتی کسی از راه ناگهان برسد

      رها کنی‌، برود، از دلت جدا باشد
      به آن‌که دوست‌ترش داشته‌، به آن برسد

      رها کنی‌، بروند و دو تا پرنده شوند
      خبر به دورترین نقطه‌ی جهان برسد

      گلایه‌ای نکنی‌، بغض خویش را بخوری‌
      که هق‌هق تو مبادا به گوششان برسد

      خدا کند که‌… نه‌! نفرین نمی‌کنم‌، نکند
      به او، که عاشق او بوده‌ام‌، زیان برسد

      خدا کند فقط این عشق از سرم برود
      خدا کند که فقط زود آن زمان برسد
    author: نجمه زارع
    language: fa

  - text: |
      روز های هجر را گذراندیم و زنده ایم
      ما را به سخت جانی خود این گمان نبود
    author: شیخ بهایی
    language: fa

  - text: |
      به حشر، تن به جحیم افکنم نخستین گام
      دل و دماغ رسن‌بازی صراطم نیست
    author: طالب آملی
    language: fa

  - text: |
      شبيه قاصدک هاى رها در دشت میدانم
      لبت بر باد خواهد داد روزى دودمانم را
    author: سید تقی سیدی
    language: fa

  - text: |
      هرگز از دوست شنیدی که کسی بشکیبد؟
      دوستی نیست در آن دل که شکیبایی هست
    author: سعدی
    language: fa

  - text: |
      مثل  عروس خان که میداند پسرزا  نیست
      حس میکنم عمر خوشی هایم به دنیا نیست 

      ته مانده ی یک قهوه ی تلخم که مدت هاست 
      در من کسی دیگر پی تعبیر فردا نیست

      وابستگی تلخ است هنگامی که می فهمی
      آنقدر هایی که خودش میگفت تنها نیست

      نفرین به دست خالی و این دل سپردن ها 
      نفرین به من ،نفرین به تصویری که زیبا نیست

      از بی تفاوت بودنم هم درد می بارد 
      یعنی گلوی بغض کرده اهل حاشا نیست

      تنهاییِ گنجشک باران خورده ایی هستم
      که در خیابان هم برایش ذره یی جا نیست 

      عاشق که باشی تازه می فهمی که گاهی مرگ
      چیزی به جز دل کندن از دلبستگی ها نیست

      دیشب نشستم با خودم از زندگی گفتم
      گفتم ببین حال  دلم خوب است، اما نیست
    author: سجاد صفری
    language: fa

  - text: |
      گفته بودم چو بیایی غم دل با تو بگویم
      چه بگویم که غم از دل برود چون تو بیایی
    author: سعدی
    language: fa

